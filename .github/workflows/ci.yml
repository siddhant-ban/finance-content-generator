name: Foundation offline acceptance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_NO_PROGRESS: '1'
      FINANCE_DATA_DIR: data/ci-maintenance-empty
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.4'
          python-version: '3.12.15'
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Verify locked runtime
        run: uv run --offline python -c "import platform,pathlib; assert platform.python_version() == pathlib.Path('.python-version').read_text().strip()"
      - name: Offline tests
        shell: bash
        run: |
          uv run --offline coverage run -m pytest tests/unit tests/integration -m 'not phoenix_live' -q
          uv run --offline coverage report
      - name: Verify below-threshold coverage is rejected
        shell: bash
        run: |
          seq 1 2000 | sed 's/.*/marker_& = 0/' > app/ci_coverage_probe.py
          trap 'rm -f app/ci_coverage_probe.py' EXIT
          export COVERAGE_FILE="$RUNNER_TEMP/finance-coverage-probe"
          uv run --offline coverage run -m pytest tests/unit/test_config.py -q
          result=0
          uv run --offline coverage report > "$RUNNER_TEMP/finance-probe.txt" || result=$?
          grep -E 'app/ci_coverage_probe.py|TOTAL|Coverage failure' "$RUNNER_TEMP/finance-probe.txt"
          grep -E 'app/ci_coverage_probe.py +2000 +2000 +0\.000000%' "$RUNNER_TEMP/finance-probe.txt"
          test "$result" = 2
          uv run --offline python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          from coverage import CoverageData

          path = Path("app/ci_coverage_probe.py").resolve()
          path.write_text("probe = 0\n" * 1000)
          for covered, expected in ((899, 2), (900, 0)):
              data = CoverageData(basename=os.environ["COVERAGE_FILE"])
              data.erase()
              data.add_lines({str(path): set(range(1, covered + 1))})
              data.write()
              result = subprocess.run(
                  [sys.executable, "-m", "coverage", "report", "--include=*/ci_coverage_probe.py"],
                  check=False,
              )
              assert result.returncode == expected, (covered, result.returncode)
          PY
      - name: Synthetic acceptance and local evidence
        run: uv run --offline python -m app.demo --offline --output data/foundation-demo
      - name: Retention dry run on fresh absent root
        run: uv run --offline python -m app.maintenance --dry-run
      - name: Upload sanitized aggregate report only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: synthetic-foundation-public-report
          path: data/foundation-demo/public-report.json
          if-no-files-found: error
          retention-days: 7
