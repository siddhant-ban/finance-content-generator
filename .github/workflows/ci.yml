name: Foundation offline acceptance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_NO_PROGRESS: '1'
      FINANCE_DATA_DIR: data/ci-maintenance-empty
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.4'
          python-version: '3.12.15'
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Verify locked runtime
        run: uv run --offline python -c "import platform,pathlib; assert platform.python_version() == pathlib.Path('.python-version').read_text().strip()"
      - name: Verify worker coverage gate with an unimported module
        shell: bash
        run: |
          seq 1 2000 | sed 's/.*/marker_& = 0/' > app/ci_coverage_probe.py
          trap 'rm -f app/ci_coverage_probe.py' EXIT
          result=0
          COVERAGE_CORE=sysmon uv run --offline --no-sync pytest tests/unit/test_config.py -q \
            -n 4 --dist worksteal --cov --cov-report=term > "$RUNNER_TEMP/finance-probe.txt" || result=$?
          grep -E 'app/ci_coverage_probe.py|TOTAL|Required test coverage' "$RUNNER_TEMP/finance-probe.txt"
          grep -E 'app/ci_coverage_probe.py +2000 +2000 +0\.000000%' "$RUNNER_TEMP/finance-probe.txt"
          test "$result" = 1
      - name: Run the documented mutmut command
        shell: bash
        run: |
          export TMPDIR="$(mktemp -d /dev/shm/finance-mutmut.XXXXXX)"
          uv pip install mutmut==3.8.1
          uv run --offline --no-sync mutmut run --max-children 4 'app.workflow.state.x_allowed_edge__mutmut_*'
          uv run --offline --no-sync mutmut results --all true | grep 'x_allowed_edge__mutmut_'
