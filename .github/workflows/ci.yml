name: Foundation offline acceptance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_NO_PROGRESS: '1'
      FINANCE_DATA_DIR: data/ci-maintenance-empty
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.4'
          python-version: '3.12.15'
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Verify locked runtime
        run: uv run --offline python -c "import platform,pathlib; assert platform.python_version() == pathlib.Path('.python-version').read_text().strip()"
      - name: Offline tests
        run: uv run --offline pytest tests/unit tests/integration -m 'not phoenix_live' -q
      - name: Measure collection, slow tests and application coverage
        shell: bash
        run: |
          uv pip install coverage==7.10.7
          time uv run --offline --no-sync pytest tests/unit tests/integration -m 'not phoenix_live' -q --collect-only | tail -n 3
          uv run --offline --no-sync coverage run --source=app -m pytest tests/unit tests/integration -m 'not phoenix_live' -q --durations=35 --durations-min=0
          uv run --offline --no-sync coverage report --show-missing
      - name: Demonstrate missing coverage gate
        shell: bash
        run: |
          seq 1 2000 | sed 's/^/marker_& = 0/' > app/ci_coverage_probe.py
          trap 'rm -f app/ci_coverage_probe.py' EXIT
          uv run --offline --no-sync coverage run --source=app -m pytest tests/unit tests/integration -m 'not phoenix_live' -q
          uv run --offline --no-sync coverage report | grep -E 'app/ci_coverage_probe|TOTAL'
      - name: Synthetic acceptance and local evidence
        run: uv run --offline python -m app.demo --offline --output data/foundation-demo
      - name: Retention dry run on fresh absent root
        run: uv run --offline python -m app.maintenance --dry-run
      - name: Upload sanitized aggregate report only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: synthetic-foundation-public-report
          path: data/foundation-demo/public-report.json
          if-no-files-found: error
          retention-days: 7
