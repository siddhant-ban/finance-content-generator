name: Foundation offline acceptance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        suite: [baseline, consolidated]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_NO_PROGRESS: '1'
      FINANCE_DATA_DIR: data/ci-maintenance-empty
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.4'
          python-version: '3.12.15'
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Verify locked runtime
        run: uv run --offline python -c "import platform,pathlib; assert platform.python_version() == pathlib.Path('.python-version').read_text().strip()"
      - name: Compare release test mutation results
        shell: bash
        run: |
          uv pip install mutmut==3.8.1
          if [[ '${{ matrix.suite }}' == consolidated ]]; then
            python - <<'PY'
          from pathlib import Path
          p = Path("tests/unit/test_release_gate.py")
          code = p.read_text()
          start = code.index("def test_synthetic_release_cannot_enable_real_agent(")
          stop = code.index("def test_complete_offline_export_allowed_missing_evals_denied(", start)
          code = code[:start] + code[stop:]
          anchor = "    assert service.active('foundation') is None\n"
          assert code.count(anchor) == 1
          code = code.replace(
              anchor,
              anchor + "    with pytest.raises(ValueError):\n        service.require_approved('researcher', {}, validators_ready=True)\n",
          )
          p.write_text(code)
          PY
          fi
          mkdir -p data
          cp pyproject.toml data/pyproject-before-mutmut.toml
          cat >> pyproject.toml <<'TOML'

          [tool.mutmut]
          source_paths = ["app"]
          only_mutate = ["app/release/service.py"]
          also_copy = ["tests", "pyproject.toml", "evals", "prompts", "schemas", ".python-version"]
          pytest_add_cli_args_test_selection = ["tests/unit", "tests/integration"]
          pytest_add_cli_args = ["-m", "not phoenix_live"]
          TOML
          export TMPDIR="$(mktemp -d /dev/shm/finance-mutmut.XXXXXX)"
          prefix='app.release.service.xǁReleaseServiceǁ'
          uv run --offline --no-sync mutmut run --max-children 4 \
            "${prefix}check__mutmut_*" "${prefix}active__mutmut_*" "${prefix}require_approved__mutmut_*"
          if uv run --offline --no-sync mutmut results --help | grep -q -- '--all BOOLEAN'; then
            uv run --offline --no-sync mutmut results --all true > data/mutation-results.txt
          else
            uv run --offline --no-sync mutmut results --all > data/mutation-results.txt
          fi
          grep -E 'ǁ(check|active|require_approved)__mutmut_' data/mutation-results.txt
