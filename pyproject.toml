[project]
name = "finance-content-generator"
version = "0.1.0"
description = "Evaluation-first local editorial pipeline foundations"
requires-python = ">=3.12,<3.13"
dependencies = ["streamlit==1.67.0", "pydantic>=2.12,<3", "arize-phoenix-client==3.7.0", "httpx==0.28.1", "fastapi==0.162.4", "uvicorn==0.54.0", "authlib==1.9.5", "opentelemetry-sdk==1.45.2", "opentelemetry-exporter-otlp-proto-http==1.45.2"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx2==2.16.0", "coverage==7.10.7", "pytest-cov==7.0.0", "pytest-xdist==3.8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = ["phoenix_live: requires explicit local Phoenix opt-in"]

[tool.coverage.run]
source = ["app"]
branch = false

[tool.coverage.report]
include_namespace_packages = true
fail_under = 90
precision = 6
show_missing = true

[tool.mutmut]
source_paths = ["app"]
only_mutate = ["app/workflow/state.py", "app/release/service.py"]
also_copy = ["tests", "pyproject.toml", "evals", "prompts", "schemas", ".python-version"]
pytest_add_cli_args_test_selection = ["tests/unit", "tests/integration"]
pytest_add_cli_args = ["-m", "not phoenix_live"]
